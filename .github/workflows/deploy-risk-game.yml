name: Deploy Risk Game to GitHub Pages

on:
  push:
    branches: ['claude/risk-game-webapp-vuFJd', 'main', 'master']
    paths:
      - 'src/app/risk/**'
      - 'public/team/**'
      - '.github/workflows/deploy-risk-game.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static Risk game
        run: |
          # Create a temporary next.config for static export
          cat > next.config.pages.mjs << 'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: "export",
            basePath: process.env.PAGES_BASE_PATH || "",
            images: { unoptimized: true },
          };
          export default nextConfig;
          EOF

          # Create a minimal app with only the risk page
          mkdir -p .pages-build/app/risk
          mkdir -p .pages-build/app

          # Copy risk game files
          cp src/app/risk/RiskGame.tsx .pages-build/app/risk/
          cp src/app/risk/gameData.ts .pages-build/app/risk/
          cp src/app/risk/gameLogic.ts .pages-build/app/risk/
          cp src/app/risk/types.ts .pages-build/app/risk/
          cp src/app/risk/page.tsx .pages-build/app/risk/

          # Create root layout
          cat > .pages-build/app/layout.tsx << 'LAYOUT'
          import type { Metadata } from "next";
          import "./globals.css";
          export const metadata: Metadata = {
            title: "RISK: Mission Control Vice City Edition",
            description: "Conquer the gaming world — a Risk board game featuring the Mission:Control team",
          };
          export default function RootLayout({ children }: { children: React.ReactNode }) {
            return (<html lang="en"><body className="antialiased">{children}</body></html>);
          }
          LAYOUT

          # Create root page that shows the game directly
          cat > .pages-build/app/page.tsx << 'PAGE'
          import RiskGame from './risk/RiskGame';
          export default function Home() { return <RiskGame />; }
          PAGE

          # Copy globals.css
          cp src/app/globals.css .pages-build/app/globals.css

          # Swap app directory
          mv src/app src/app.bak
          mv .pages-build/app src/app

          # Swap next config
          mv next.config.mjs next.config.mjs.bak
          mv next.config.pages.mjs next.config.mjs

          # Set base path for GitHub Pages
          export PAGES_BASE_PATH="/${{ github.event.repository.name }}"
          export NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}"

          # Build
          npx next build

          # Restore originals
          rm -rf src/app
          mv src/app.bak src/app
          mv next.config.mjs.bak next.config.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
